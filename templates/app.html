{% extends "base.html" %}{% load static %}
{% block title %}PlannedOut{% endblock %}
{% block body %}
<header class="top">
  <span class="brand"><img src="{% static 'img/logo-icon.png' %}" alt="" width="28" height="28">PlannedOut<span class="tld">.in</span></span>
  <nav class="tabs" id="tabs" hidden></nav>
  <form method="post" action="/logout/">{% csrf_token %}<button class="link" type="submit">Sign out</button></form>
</header>
<main class="wrap" id="root"><p class="muted">Loading…</p></main>
<script type="module" src="{% static JS_DIR|add:'/app.js' %}"></script>
{% endblock %}
