<div class="calc-grid">
  <label>Essential monthly expenses <input name="essentials" inputmode="decimal" value="50000"></label>
  <label>Your situation
    <select name="situation">
      <option value="3">Salaried, with a second earner at home</option>
      <option value="6" selected>Salaried, only earner</option>
      <option value="9">Freelance or contract income</option>
      <option value="12">Self-employed or business owner</option>
    </select>
  </label>
  <label>Months of cover <input name="months" inputmode="decimal" value="6"></label>
  <label>Already set aside <input name="saved" inputmode="decimal" value="100000"></label>
  <label>You can add each month <input name="monthly" inputmode="decimal" value="15000"></label>
</div>
