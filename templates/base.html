{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlannedOut{% endblock %}</title>
  <meta name="description" content="{% block description %}Plan your month around when money comes in and goes out. Your data is encrypted in your browser.{% endblock %}">
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" href="{% static 'img/favicon-64.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#1c1e24">
  <meta property="og:image" content="{% static 'img/logo-full.png' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static JS_DIR|add:'/theme.js' %}"></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
