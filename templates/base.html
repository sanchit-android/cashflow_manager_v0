{% load static %}<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlannedOut{% endblock %}</title>
  <meta name="description" content="{% block description %}Free, private cash-flow and budget planner. Spreadsheet-style entry, monthly analytics, savings projections, and data encrypted in your browser.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow, max-snippet:-1, max-image-preview:large{% endblock %}">
  <link rel="canonical" href="{{ CANONICAL_URL }}">
  <link rel="alternate" hreflang="en-IN" href="{{ CANONICAL_URL }}">
  <link rel="alternate" hreflang="x-default" href="{{ CANONICAL_URL }}">
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" href="{% static 'img/favicon-64.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#1c1e24">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PlannedOut">
  <meta property="og:locale" content="en_IN">
  <meta property="og:url" content="{{ CANONICAL_URL }}">
  <meta property="og:title" content="{% block og_title %}PlannedOut — private cash-flow planner{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Know whether this month adds to your savings or eats into them. Spreadsheet-style entry, analytics and projections, encrypted in your browser.{% endblock %}">
  <meta property="og:image" content="{{ SITE_URL }}{% static 'img/logo-full.png' %}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static JS_DIR|add:'/theme.js' %}"></script>
  {% if jsonld %}<script type="application/ld+json">{{ jsonld }}</script>{% endif %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
